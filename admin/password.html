<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <title>Set New Password | St. Teresa Academy Portals</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="password" class="login-page">

  <main class="login-card">

    <header class="login-brand">
      <img class="login-crest" src="../images/favicon.svg" width="52" height="52" alt="St. Teresa Kanyange Academy crest">
      <div class="login-brand-text">
        <h1>St. Teresa Kanyange Academy</h1>
        <p>Set New Password</p>
      </div>
    </header>

    <p class="account-note">
      Signed in as <strong id="changeName">…</strong>
      <span class="badge badge-navy" id="changeRole"></span>
      <br><small id="changeHint">Choose a new password to secure your account before continuing.</small>
    </p>

    <div class="change-banner" id="tempBanner"></div>

    <div class="login-error" id="changeError" role="alert"></div>

    <form class="login-form" id="changeForm" novalidate>
      <div class="form-group" id="currentPasswordGroup">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" placeholder="Enter your current password"
          autocomplete="current-password" required>
        <small class="field-hint">Use your temporary password if this is your first sign-in.</small>
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="8" required>
        <div class="pw-meter" id="pwMeter" data-score="0"><i></i></div>
        <small class="pw-meter-text" id="pwMeterText">At least 8 characters, one letter and one number.</small>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="login-btn"><i class="fas fa-key" aria-hidden="true"></i>&nbsp; Save Password &amp; Continue</button>
    </form>

    <a href="#" class="login-back" id="changeCancel"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Sign out instead</a>

  </main>

  <script src="../js/persist.js"></script>
<script src="../js/admin.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/modules.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
